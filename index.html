<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>方塊遊戲(amais23)</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="score-board">Score: <span id="score">0</span></div>
        </div>

        <div id="board" class="board"></div>

        <div class="section-title">可用方塊</div>
        <div id="usable-area" class="block-area"></div>

        <div class="section-title">預備方塊</div>
        <div id="preview-area" class="block-area preview"></div>

        <div id="game-over" class="overlay hidden">
            <h2>Game Over</h2>
            <p>Score: <span id="final-score">0</span></p>
            <p>最高分數 (<span id="mode-label">普通</span>): <span id="high-score">0</span></p>
            <div class="btn-group">
                <button id="restart-btn" class="action-btn">再玩一次</button>
                <button id="menu-btn" class="action-btn menu-btn">回主選單</button>
            </div>
        </div>

        <div id="start-screen" class="overlay">
            <h1>8x8 方塊遊戲</h1>
            <p>請選擇遊戲難度：</p>
            <div class="btn-group">
                <button id="btn-easy" class="mode-btn">🟢 簡單模式</button>
                <button id="btn-normal" class="mode-btn">🔴 普通模式</button>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
